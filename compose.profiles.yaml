# Opt-in service selection: set COMPOSE_FILE=compose.yaml:compose.profiles.yaml in .env, then choose
# COMPOSE_PROFILES (docs/interfaces.md#optional-services). compose.yaml alone still runs the whole stack.
# Nginx Proxy Manager is the core service; every other service is optional. autoheal and its socket proxy share
# a profile so enabling restart supervision always includes its Docker API dependency.
services:
  uptime-kuma:
    profiles: [uptime-kuma]
  peanut:
    profiles: [peanut]
  portainer:
    profiles: [portainer]
  autoheal:
    profiles: [autoheal]
  socket-proxy:
    profiles: [autoheal]
