version: 2
# Patch, minor and major updates are auto-merged once every required check passes
# (workflows/dependabot-auto-merge.yml; majors since 2026-10-14, owner's decision); every Portainer update and any
# update Dependabot can't classify wait for the maintainer. A merge deploys: the server's pull agent applies main
# within minutes, so a major that migrates a service's data one way has the nightly backup behind it.
updates:
  # The stack's images in compose.yaml (version tag and digest).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]

  # The check and test tools (requirements-dev.txt), pinned with hashes.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]
    groups:
      # init, analyze and upload-sarif must share one version.
      codeql:
        patterns:
          - "github/codeql-action*"
